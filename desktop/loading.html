<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RequestLoom</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "IBM Plex Sans", "Segoe UI", "Noto Sans", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #161616 0%, #0d0d0d 100%);
        color: #d1d5db;
      }

      .shell {
        width: min(560px, 84vw);
        border: 1px solid #334155;
        background: rgba(20, 20, 20, 0.96);
        padding: 24px;
      }

      .title {
        margin: 0 0 8px;
        font-size: 15px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #e2e8f0;
      }

      .message {
        margin: 0;
        font-size: 13px;
        color: #94a3b8;
      }

      .bar {
        margin-top: 16px;
        height: 2px;
        background: #252525;
        overflow: hidden;
      }

      .bar::after {
        content: "";
        display: block;
        width: 30%;
        height: 100%;
        background: #555555;
        animation: move 1.1s ease-in-out infinite;
      }

      @keyframes move {
        0% {
          transform: translateX(-120%);
        }

        60% {
          transform: translateX(260%);
        }

        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <div class="shell" role="status" aria-live="polite">
      <h1 class="title">RequestLoom</h1>
      <p class="message">Starting local backend and loading workspace data...</p>
      <div class="bar"></div>
    </div>
  </body>
</html>
